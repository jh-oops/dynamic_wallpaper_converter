<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源位物料快速剪裁</title>
<style>
  :root{
    --desk:#7d746a; --paper:#f4ecd8; --paper-2:#e8dec6; --ink:#1a1a1a; --ink-dim:#5c5348;
    --border:#1a1a1a; --shadow:#1a1a1a;
    --win-blue:#4a9fc9; --win-yellow:#e8c649; --win-red:#e86b6b; --win-pink:#f1948a;
    --win-orange:#e8a649; --win-green:#7cb87c;
    --btn-yellow:#f4d03f; --btn-blue:#5dade2; --btn-red:#ec7063; --btn-green:#82c982;
    --ok:#3d8c3d; --warn:#c9872c; --err:#c94a4a;
    --bw:3px; --sh:6px 6px 0 var(--shadow); --sh-sm:3px 3px 0 var(--shadow);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);overflow-x:hidden;
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","PingFang SC","Microsoft YaHei",ui-sans-serif,sans-serif;
    background:var(--desk);
    background-image:radial-gradient(circle at 20% 20%, rgba(255,255,255,.06) 0 2px, transparent 3px),
                     radial-gradient(circle at 80% 70%, rgba(0,0,0,.08) 0 2px, transparent 3px);
    background-size:24px 24px,36px 36px;}
  ::-webkit-scrollbar{width:14px;height:14px}
  ::-webkit-scrollbar-track{background:var(--paper-2);border-left:var(--bw) solid var(--border)}
  ::-webkit-scrollbar-thumb{background:var(--win-yellow);border:var(--bw) solid var(--border);box-shadow:inset -3px -3px 0 rgba(0,0,0,.15)}

  .wrap{max-width:880px;width:100%;margin:0 auto;padding:8px 14px 20px}
  .topbar{background:var(--paper);border:var(--bw) solid var(--border);box-shadow:var(--sh);padding:6px 18px 6px;position:relative}
  .topbar::after{content:"";position:absolute;top:0;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,var(--win-yellow) 0 20px,var(--win-red) 20px 40px,var(--win-blue) 40px 60px,var(--win-green) 60px 80px);border-bottom:var(--bw) solid var(--border)}
  .topbar h1{margin:8px 0 0;font-size:20px;font-weight:900;letter-spacing:.02em}
  .topbar .sub{color:var(--ink-dim);font-size:12px;font-weight:700;margin-top:6px;max-width:760px;line-height:1.6}

  .card{background:var(--paper);border:var(--bw) solid var(--border);box-shadow:var(--sh);margin-bottom:12px;position:relative;overflow:hidden;animation:pop .35s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .card h2{margin:0;padding:10px 14px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
    background:var(--win-yellow);border-bottom:var(--bw) solid var(--border);color:var(--ink);display:flex;align-items:center;gap:8px}
  .card-body{padding:12px 14px 14px}

  .step{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:var(--bw) solid var(--border);
    background:var(--win-blue);color:#fff;margin-right:6px;box-shadow:2px 2px 0 var(--shadow);flex:0 0 auto;position:relative;top:-1px}
  .step::before{content:"";width:14px;height:14px;display:block;background-repeat:no-repeat;background-position:center;background-size:contain;image-rendering:pixelated}
  .step[data-icon="crop"]::before{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cpath%20d%3D%22M4%201%20H6%20V3%20H4%20Z%20M10%201%20H12%20V3%20H10%20Z%20M4%2013%20H6%20V15%20H4%20Z%20M10%2013%20H12%20V15%20H10%20Z%20M1%204%20H3%20V6%20H1%20Z%20M1%2010%20H3%20V12%20H1%20Z%20M13%204%20H15%20V6%20H13%20Z%20M13%2010%20H15%20V12%20H13%20Z%20M4%204%20H12%20V12%20H4%20Z%22%20fill%3D%22%23fff%22%20fill-rule%3D%22evenodd%22%2F%3E%3C%2Fsvg%3E")}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;background:var(--paper-2);border:var(--bw) solid var(--border);color:var(--ink);
    border-radius:0;padding:10px 11px;font-size:13px;outline:none;font-family:inherit;font-weight:700;box-shadow:3px 3px 0 rgba(0,0,0,.15)}
  .field input:focus,.field select:focus,.field textarea:focus{box-shadow:5px 5px 0 rgba(0,0,0,.25);background:#fff}

  .drop{position:relative;border:var(--bw) dashed var(--ink-dim);padding:16px 14px;text-align:center;color:var(--ink-dim);cursor:pointer;
    background:var(--paper-2);margin-bottom:10px;font-weight:700;transition:.1s}
  .drop:hover,.drop.over{border-style:solid;border-color:var(--border);background:#fff;transform:translate(-1px,-1px);box-shadow:var(--sh-sm)}
  .drop .big{font-size:15px;color:var(--ink);font-weight:900}
  .fname{margin-top:10px;font-size:13px;font-weight:800;color:var(--win-blue)}
  .hint{color:var(--ink-dim);font-size:12px;margin-top:8px;line-height:1.6;font-weight:700}
  .btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  button.go{background:var(--btn-yellow);color:var(--ink);border:var(--bw) solid var(--border);padding:12px 22px;font-size:14px;font-weight:900;
    cursor:pointer;box-shadow:var(--sh-sm);text-transform:uppercase;letter-spacing:.03em}
  button.go:hover{filter:brightness(1.05);transform:translate(-1px,-1px)}
  button.go:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
  button.go:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none;filter:grayscale(.4)}
  button.secondary{background:var(--btn-blue);color:#fff;border:var(--bw) solid var(--border);padding:11px 18px;font-size:13px;font-weight:900;
    cursor:pointer;box-shadow:var(--sh-sm);text-transform:uppercase;letter-spacing:.03em}
  button.secondary:hover{filter:brightness(1.05);transform:translate(-1px,-1px)}
  button.secondary:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
  .spin{display:inline-block;width:14px;height:14px;border:var(--bw) solid currentColor;border-top-color:transparent;animation:sp .8s steps(8) infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .status{margin-top:10px;padding:10px 12px;font-size:13px;font-weight:700;background:var(--paper-2);border:var(--bw) solid var(--border);
    min-height:20px;white-space:pre-wrap;word-break:break-all;box-shadow:3px 3px 0 rgba(0,0,0,.12)}
  .status.ok{background:#d4edda;border-color:var(--ok);color:#1e4d1e}
  .status.warn{background:#fff3cd;border-color:var(--warn);color:#6b4b1a}
  .status.err{background:#f8d7da;border-color:var(--err);color:#66181f}
  .status.info{color:var(--ink)}
  .dl{margin-top:8px}
  .dl a{display:inline-block;background:var(--paper-2);border:var(--bw) solid var(--border);color:var(--ink);text-decoration:none;
    padding:10px 14px;font-size:13px;font-weight:800;margin-right:8px;box-shadow:var(--sh-sm)}
  .dl a:hover{background:var(--btn-yellow);transform:translate(-1px,-1px)}
  .dl a:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}

  .crop-editor-wrap{display:flex;gap:12px;margin:6px 0;align-items:flex-start;flex-wrap:wrap}
  .crop-stage-wrap{flex:1;min-width:300px;background:var(--paper-2);border:var(--bw) solid var(--border);box-shadow:var(--sh-sm);padding:6px}
  .crop-stage-title{font-size:11px;font-weight:900;color:var(--ink);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  .crop-stage{position:relative;width:100%;max-width:560px;margin:0 auto;overflow:hidden;background:#000;
    cursor:grab;border:2px solid var(--border)}
  .crop-stage:active{cursor:grabbing}
  .crop-stage-img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--img-scale,1));transform-origin:center;
    max-width:none;max-height:none;user-select:none;-webkit-user-drag:none;pointer-events:none;image-rendering:auto}
  .crop-overlay{position:absolute;inset:0;background:rgba(0,0,0,.18);pointer-events:none}
  .crop-frame{position:absolute;left:0;top:0;right:0;bottom:0;border:3px dashed var(--win-yellow);pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);z-index:2}
  .crop-frame::before{content:'';position:absolute;inset:0;border:1px solid rgba(255,255,255,.4);pointer-events:none}
  .crop-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;pointer-events:none;z-index:3}
  .crop-controls{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .crop-controls label{font-size:12px;font-weight:900;color:var(--ink);white-space:nowrap}
  .crop-controls input[type=range]{flex:1;min-width:120px}
  .crop-prev-meta{margin-top:6px;font-size:12px;font-weight:700;color:var(--ink-dim);text-align:center;min-height:16px}
  @media (max-width:760px){ .crop-editor-wrap{flex-direction:column} .crop-stage-wrap{min-width:auto;width:100%} }
</style>
</head>
<body>
  <div class="wrap">
  <div class="topbar">
    <h1>资源位物料快速剪裁</h1>
    <div class="sub">纯前端 · 离线运行 · 素材不出本机。拖拽取景、滑块缩放，一键裁剪，可下载 JPG 或直接复制图片到剪贴板（自动按大小上限压缩）。</div>
  </div>
  <div class="card">
    <div class="card-body">
      <div class="drop" id="drop-crop">
        <div class="big">拖入静态壁纸图片到这里，或点击选择</div>
      </div>
      <input type="file" id="file-crop" accept="image/*" hidden>
      <div class="fname" id="fname-crop" style="display:none"></div>

      <div class="crop-editor-wrap" id="crop-editor-wrap" style="display:none">
        <div class="crop-stage-wrap">
          <div class="crop-stage-title">所见即所得 · 拖拽移动 · 滑块缩放</div>
          <div class="crop-stage" id="crop-stage">
            <img id="crop-stage-img" class="crop-stage-img" alt="原图">
            <div class="crop-overlay"></div>
            <div class="crop-frame"></div>
            <div class="crop-hint">虚线框内 = 实际输出</div>
          </div>
          <div class="crop-controls">
            <label>缩放 <span id="crop-scale-val">1.0</span>x</label>
            <input type="range" id="crop-scale" min="1" max="5" step="0.05" value="1">
            <button class="secondary" id="crop-reset-view" type="button" style="padding:6px 10px;font-size:11px">重置取景</button>
          </div>
          <div class="crop-prev-meta" id="crop-result-meta"></div>
        </div>
      </div>

      <div class="grid">
        <div class="field"><label>尺寸预设</label>
          <select id="preset-crop">
            <option value="custom" data-w="" data-h="" data-maxkb="">自定义</option>
            <option value="banner" data-w="984" data-h="390" data-maxkb="300" selected>banner 984 × 390（≤300KB）</option>
            <option value="bigcard" data-w="984" data-h="1050" data-maxkb="300">大卡 984 × 1050（≤300KB）</option>
            <option value="waterfall" data-w="474" data-h="294" data-maxkb="300">瀑布流卡 474 × 294（≤300KB）</option>
            <option value="wallpaper" data-w="1080" data-h="2160" data-maxkb="0">静态壁纸 1080 × 2160（不限制）</option>
          </select>
        </div>
        <div class="field"><label>裁剪模式</label>
          <select id="mode-crop">
            <option value="cover" selected>Cover：缩放铺满目标，按画面比例居中裁剪</option>
            <option value="crop">剪裁：按目标尺寸从原图中心裁切，不拉伸画面</option>
          </select>
        </div>
      </div>
      <div class="grid">
        <div class="field"><label>目标宽度 px</label><input type="number" id="w-crop" value="984" min="1"></div>
        <div class="field"><label>目标高度 px</label><input type="number" id="h-crop" value="390" min="1"></div>
        <div class="field"><label>大小限制 KB（0=不限制）</label><input type="number" id="maxkb-crop" value="300" min="0"></div>
      </div>
      <div class="btns">
        <button class="go" id="go-crop">裁剪并下载</button>
        <button class="secondary" id="copy-crop" type="button" disabled>复制图片</button>
      </div>
      <div class="status" id="status-crop"></div>
      <div class="dl" id="dl-crop"></div>
    </div>
  </div>

  <!-- 隐藏的结果画布：用于纯前端像素裁剪导出 -->
  <canvas id="crop-result-canvas" style="display:none"></canvas>
</div>

<script>
const $ = id => document.getElementById(id);
function setStatus(id, msg, type){ const el=$(id); el.className='status'+(type?(' '+type):''); el.innerHTML=msg; }
function downloadBlob(blob, name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
function bindDrop(dropId, inputId, fnameId, onPick){
  const drop=$(dropId), input=$(inputId);
  drop.addEventListener('click', ()=>input.click());
  input.addEventListener('change', ()=>{ if(input.files[0]) onPick(input.files[0]); });
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) onPick(f); });
}
function showFname(fnameId, f){ $(fnameId).style.display='block'; $(fnameId).textContent='已选择：'+f.name; }

let cropEditor = null, cropFile = null, lastPngBlob = null;

function initCropEditor(){
  if (cropEditor) return cropEditor;
  class CropEditor {
    constructor(){
      this.stage = $('crop-stage');
      this.stageImg = $('crop-stage-img');
      this.resultCanvas = $('crop-result-canvas');
      this.scaleInput = $('crop-scale');
      this.scaleVal = $('crop-scale-val');
      this.target_w = 984; this.target_h = 390; this.mode = 'cover';
      this.offset_x = 0.5; this.offset_y = 0.5; this.user_scale = 1.0;
      this.base_scale = 1; this.dragging = false; this.lastX = 0; this.lastY = 0;
      this.imgLoaded = false;
      this.bindEvents();
    }
    setImage(file){
      if (this.stageImg.src && this.stageImg.src.startsWith('blob:')) URL.revokeObjectURL(this.stageImg.src);
      this.stageImg.src = URL.createObjectURL(file);
      this.stageImg.onload = () => {
        this.imgLoaded = true;
        this.resetView();
        this.applyTarget();
        $('crop-editor-wrap').style.display = 'flex';
        this.renderResult();
        $('crop-result-meta').textContent = `${this.stageImg.naturalWidth} × ${this.stageImg.naturalHeight} px / 原图`;
      };
    }
    setTarget(w, h, mode){
      this.target_w = parseInt(w, 10) || 984;
      this.target_h = parseInt(h, 10) || 390;
      this.mode = mode || 'cover';
      this.stage.style.setProperty('--crop-ratio', `${this.target_w}/${this.target_h}`);
      const isCrop = this.mode === 'crop';
      this.scaleInput.disabled = isCrop;
      this.scaleInput.title = isCrop ? 'Crop 模式下禁用缩放' : '放大原图以调整取景范围';
      if (isCrop && this.user_scale !== 1.0){ this.user_scale = 1.0; this.scaleInput.value = 1; this.scaleVal.textContent = '1.0'; }
      if (this.imgLoaded){ this.resetView(); this.applyTarget(); this.renderResult(); }
    }
    resetView(){
      this.offset_x = 0.5; this.offset_y = 0.5;
      if (this.mode !== 'crop'){ this.user_scale = 1.0; this.scaleInput.value = 1; this.scaleVal.textContent = '1.0'; }
    }
    stageRect(){
      const r = this.stage.getBoundingClientRect();
      return {w: r.width, h: r.height};
    }
    fitBox(){
      const maxW = Math.min(this.stage.parentElement ? this.stage.parentElement.clientWidth : 560, 560);
      const maxH = Math.min(window.innerHeight * 0.6, 560);
      const tw = this.target_w, th = this.target_h;
      let w, h;
      if (tw >= th){ w = maxW; h = w * th / tw; if (h > maxH){ h = maxH; w = h * tw / th; } }
      else { h = maxH; w = h * tw / th; if (w > maxW){ w = maxW; h = w * th / tw; } }
      return {w: Math.round(w), h: Math.round(h)};
    }
    computeBaseScale(){
      const s = this.stageRect();
      if (this.mode === 'crop') return s.w / this.target_w;
      return Math.max(s.w / this.stageImg.naturalWidth, s.h / this.stageImg.naturalHeight);
    }
    applyTarget(){
      const box = this.fitBox();
      this.stage.style.width = `${box.w}px`;
      this.stage.style.height = `${box.h}px`;
      this.base_scale = this.computeBaseScale();
      const actual = this.base_scale * this.user_scale;
      const scaled_w = this.stageImg.naturalWidth * actual;
      const scaled_h = this.stageImg.naturalHeight * actual;
      const s = this.stageRect();
      const move_w = Math.max(scaled_w - s.w, 0);
      const move_h = Math.max(scaled_h - s.h, 0);
      const dx = (0.5 - this.offset_x) * move_w;
      const dy = (0.5 - this.offset_y) * move_h;
      this.stageImg.style.width = `${this.stageImg.naturalWidth * this.base_scale}px`;
      this.stageImg.style.height = `${this.stageImg.naturalHeight * this.base_scale}px`;
      this.stageImg.style.setProperty('--img-scale', this.user_scale.toFixed(4));
      this.stageImg.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${this.user_scale.toFixed(4)})`;
    }
    renderResult(){
      if (!this.imgLoaded || !this.resultCanvas) return;
      const c = this.resultCanvas, ctx = c.getContext('2d');
      c.width = this.target_w; c.height = this.target_h;
      const sw = this.stageImg.naturalWidth, sh = this.stageImg.naturalHeight;
      if (this.mode === 'crop'){
        const sx = this.offset_x * Math.max(sw - this.target_w, 0);
        const sy = this.offset_y * Math.max(sh - this.target_h, 0);
        ctx.drawImage(this.stageImg, sx, sy, this.target_w, this.target_h, 0, 0, this.target_w, this.target_h);
      } else {
        const base_scale = Math.max(this.target_w / sw, this.target_h / sh);
        const actual = base_scale * this.user_scale;
        const sample_w = this.target_w / actual;
        const sample_h = this.target_h / actual;
        const move_w = Math.max(sw * actual - this.target_w, 0) / actual;
        const move_h = Math.max(sh * actual - this.target_h, 0) / actual;
        const sx = this.offset_x * move_w;
        const sy = this.offset_y * move_h;
        ctx.drawImage(this.stageImg, sx, sy, sample_w, sample_h, 0, 0, this.target_w, this.target_h);
      }
    }
    bindEvents(){
      this.scaleInput.addEventListener('input', () => {
        if (this.mode === 'crop') return;
        this.user_scale = parseFloat(this.scaleInput.value);
        this.scaleVal.textContent = this.user_scale.toFixed(2);
        this.applyTarget();
        this.renderResult();
      });
      $('crop-reset-view').addEventListener('click', () => { this.resetView(); this.applyTarget(); this.renderResult(); });
      const start = (x, y) => { if (!this.imgLoaded) return; this.dragging = true; this.lastX = x; this.lastY = y; this.stage.style.cursor = 'grabbing'; };
      const move = (x, y) => {
        if (!this.dragging) return;
        const dx = x - this.lastX, dy = y - this.lastY;
        this.lastX = x; this.lastY = y;
        const s = this.stageRect();
        const actual = this.base_scale * this.user_scale;
        const scaled_w = this.stageImg.naturalWidth * actual;
        const scaled_h = this.stageImg.naturalHeight * actual;
        const move_w = Math.max(scaled_w - s.w, 0);
        const move_h = Math.max(scaled_h - s.h, 0);
        if (move_w > 0) this.offset_x = Math.max(0, Math.min(1, this.offset_x - dx / move_w));
        if (move_h > 0) this.offset_y = Math.max(0, Math.min(1, this.offset_y - dy / move_h));
        this.applyTarget();
      };
      const end = () => { this.dragging = false; this.stage.style.cursor = 'grab'; this.renderResult(); };
      this.stage.addEventListener('mousedown', e => { e.preventDefault(); start(e.clientX, e.clientY); });
      window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
      window.addEventListener('mouseup', end);
      this.stage.addEventListener('touchstart', e => { e.preventDefault(); start(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
      window.addEventListener('touchmove', e => { if (this.dragging) e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
      window.addEventListener('touchend', end);
      window.addEventListener('resize', () => { if (this.imgLoaded){ this.applyTarget(); this.renderResult(); } });
    }
    getParams(){
      return { target_w: this.target_w, target_h: this.target_h, mode: this.mode };
    }
  }
  cropEditor = new CropEditor();
  return cropEditor;
}

bindDrop('drop-crop','file-crop','fname-crop', f => {
  cropFile=f; showFname('fname-crop',f);
  const ed = initCropEditor();
  ed.setImage(f);
});
function applyCropPreset(){
  if (!cropEditor) return;
  const opt = $('preset-crop').selectedOptions[0];
  if (opt.dataset.w){ $('w-crop').value=opt.dataset.w; $('h-crop').value=opt.dataset.h; }
  if (opt.dataset.maxkb !== undefined){ $('maxkb-crop').value=opt.dataset.maxkb; }
  cropEditor.setTarget($('w-crop').value, $('h-crop').value, $('mode-crop').value);
}
$('preset-crop').addEventListener('change', applyCropPreset);
$('mode-crop').addEventListener('change', applyCropPreset);
['w-crop','h-crop'].forEach(id => { $(id).addEventListener('change', applyCropPreset); });

$('go-crop').addEventListener('click', async () => {
  if (!cropFile){ setStatus('status-crop','请先选择图片','warn'); return; }
  const btn = $('go-crop'); btn.disabled = true;
  $('copy-crop').disabled = true; lastPngBlob = null;
  setStatus('status-crop','<span class="spin"></span>裁剪中…','info');
  $('dl-crop').innerHTML = '';
  try{
    const ed = cropEditor;
    ed.applyTarget(); ed.renderResult();
    const canvas = ed.resultCanvas;
    const tw = ed.target_w, th = ed.target_h, mode = ed.mode;
    const base = cropFile.name.replace(/\.[^.]+$/, '');
    const maxkb = parseInt($('maxkb-crop').value || '0', 10) || 0;
    const draw = q => new Promise(res => canvas.toBlob(b => res(b), 'image/jpeg', q));
    let blob = await draw(0.92), q = 0.92;
    if (maxkb > 0){
      while (blob.size > maxkb * 1024 && q > 0.15){ q -= 0.08; blob = await draw(q); }
    }
    const kb = (blob.size / 1024).toFixed(1);
    const within = maxkb > 0 ? blob.size <= maxkb * 1024 : true;
    const fn = `${base}_${tw}x${th}_${mode}.jpg`;
    downloadBlob(blob, fn);
    // 额外生成 PNG 副本用于「复制图片」到剪贴板
    lastPngBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    $('copy-crop').disabled = false;
    const sizeTxt = `${kb}KB${maxkb ? (within ? ' ✓≤' + maxkb + 'KB' : ' ⚠超出限制') : ''}`;
    $('crop-result-meta').textContent = `${tw} × ${th} / ${mode} · ${sizeTxt}`;
    $('dl-crop').innerHTML = `<a href="#" id="dlcrop">⬇ ${fn}</a>`;
    $('dlcrop').onclick = e => { e.preventDefault(); downloadBlob(blob, fn); };
    setStatus('status-crop', `✓ 完成：${fn} 已下载（${tw}×${th} / ${mode} · ${sizeTxt}）；也可点「复制图片」直接粘贴`, 'ok');
  }catch(err){ setStatus('status-crop','✗ '+err.message,'err'); }
  finally{ btn.disabled = false; }
});

$('copy-crop').addEventListener('click', async () => {
  if (!lastPngBlob){ setStatus('status-crop','请先裁剪出结果','warn'); return; }
  try{
    if (!navigator.clipboard || typeof window.ClipboardItem === 'undefined'){
      throw new Error('当前环境不支持图片复制（需 HTTPS 或最新版 Chrome/Edge/Safari）');
    }
    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': lastPngBlob }) ]);
    setStatus('status-crop', '✓ 已复制到剪贴板，可直接粘贴（⌘V / Ctrl+V）', 'ok');
  }catch(err){
    setStatus('status-crop', '✗ 复制失败：' + err.message + '（可改用下载后手动粘贴）', 'err');
  }
});
</script>
</body>
</html>
